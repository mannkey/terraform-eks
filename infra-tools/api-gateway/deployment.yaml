apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway-container  
          image: headway630/pharmetrade_apigateway-server:latest
          command: ["dotnet", "PharmEtrade_ApiGateway.dll", "--urls", "http://0.0.0.0:5000"]
          ports:
            - containerPort: 5000
          env:
            - name: FEDEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: FEDEX_client_id
                  optional: true
            - name: FEDEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: FEDEX_client_secret
                  optional: true
            - name: FEDEX_RATES_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: configmap-secret
                  key: FEDEX_rates_client_id
                  optional: true
            - name: FEDEX_RATES_CLIENT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: configmap-secret
                  key: FEDEX_rates_client_secret
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
