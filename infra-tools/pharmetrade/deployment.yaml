apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmetrade-deployment
  labels:
    app: pharmetrade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharmetrade
  template:
    metadata:
      labels:
        app: pharmetrade
    spec:
      containers:
        - name: pharmetrade
          image: headway630/pharmaetrade-v1:v1
          imagePullPolicy: Always
          env:
            - name: VITE_API_BASE_URL
              value: "api-gateway-service"
          ports:
            - containerPort: 5173
              name: pharmetrade